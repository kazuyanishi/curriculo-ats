[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-ai"
version = "0.1.0"
description = "AI-assisted ATS resume analyzer and optimizer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai",
    "pydantic>=2.13,<3",
    "python-docx",
    "reportlab",
    "pypdf",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
