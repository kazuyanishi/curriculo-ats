name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Show backend versions
        run: |
          python --version
          python -m pip --version
          python -m ruff --version
          python -m pytest --version
      - name: Ruff
        run: python -m ruff check .
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Check dependencies
        run: python -m pip check
      - name: Tests
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_SHA256: 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24.19.0
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(tr -d '[:space:]' < .nvmrc)"
          test -n "$node_version"
          test "$node_version" = "24.19.0"
          node_dist="node-v${node_version}-linux-x64"
          archive="$RUNNER_TEMP/node.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" \
            "https://nodejs.org/dist/v${node_version}/${node_dist}.tar.xz"
          echo "${NODE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$archive" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Verify frontend toolchain
        shell: bash
        run: |
          set -euo pipefail
          expected_node="$(tr -d '[:space:]' < .nvmrc)"
          node --version
          npm --version
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          test "$(node --version)" = "v${expected_node}"
          engine_node="$(node -p "require('./package.json').engines.node")"
          test "$engine_node" = "$expected_node"
      - name: Install frontend dependencies
        run: npm ci
      - name: Security audit
        shell: bash
        run: |
          set -euo pipefail
          audit_file="$(mktemp)"
          trap 'rm -f "$audit_file"' EXIT
          npm audit --audit-level=low
          npm audit --json > "$audit_file"
          node -e '
            const audit = require(process.argv[1]);
            const vulnerabilities = audit.metadata.vulnerabilities;
            const severities = ["info", "low", "moderate", "high", "critical"];
            if (vulnerabilities.total !== 0 || severities.some((severity) => vulnerabilities[severity] !== 0)) {
              console.error("npm audit reported vulnerabilities", vulnerabilities);
              process.exit(1);
            }
          ' "$audit_file"
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  ci-success:
    name: CI Success
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm CI success
        run: echo "Backend and frontend CI passed."
