name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Show backend versions
        run: |
          python --version
          python -m pip --version
          python -m ruff --version
          python -m pytest --version
      - name: Ruff
        run: python -m ruff check .
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Check dependencies
        run: python -m pip check
      - name: Tests
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Show frontend versions
        run: |
          node --version
          npm --version
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  ci-success:
    name: CI Success
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm CI success
        run: echo "Backend and frontend CI passed."
